name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Odak-Pomodoro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Odak-Pomodoro-APK
          path: Odak-Pomodoro.apk
