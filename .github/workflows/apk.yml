name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon

      - name: APK'yı sürüm adıyla adlandır
        run: |
          VER=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          echo "APK_NAME=Odak-Pomodoro-v$VER.apk" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk "Odak-Pomodoro-v$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Odak-Pomodoro-APK
          path: ${{ env.APK_NAME }}

      - name: Sürüm sayfasına (Releases) yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum "$APK_NAME" \
            --title "Odak Pomodoro (son sürüm)" \
            --notes "Telefona kurmak için $APK_NAME dosyasını indir."
