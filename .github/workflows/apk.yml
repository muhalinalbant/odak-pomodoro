name: APK oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Odak-Pomodoro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Odak-Pomodoro-APK
          path: Odak-Pomodoro.apk

      - name: Sürüm sayfasına (Releases) yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum Odak-Pomodoro.apk \
            --title "Odak Pomodoro (son sürüm)" \
            --notes "Telefona kurmak için Odak-Pomodoro.apk dosyasını indir."
