plugins {
    id 'com.android.application'
}

android {
    namespace 'com.odak.pomodoro'
    compileSdk 34

    defaultConfig {
        applicationId "com.odak.pomodoro"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Kolay kurulum için hata ayıklama anahtarıyla imzalanır.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
