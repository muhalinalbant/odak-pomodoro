plugins {
    id 'com.android.application'
}

android {
    namespace 'com.odak.pomodoro'
    compileSdk 34

    defaultConfig {
        applicationId "com.odak.pomodoro"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    // Sabit imza: yeni sürümler eski uygulamanın üzerine kurulabilsin.
    // Anahtar dosyası şifrelidir; şifre GitHub'daki KEYSTORE_PASSWORD gizli değişkeninden gelir.
    signingConfigs {
        odak {
            storeFile file('odak.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'odak'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.odak
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
